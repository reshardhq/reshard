[package]
name = "rebeam-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rebeam — talk to your agents from anywhere."

[[bin]]
name = "rebeam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
futures-util = "0.3.33"
owo-colors = "4.3.0"
rebeam-core = { workspace = true }
rebeam-runtime = { workspace = true }
flate2 = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "io-std", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
toml = "1.1.4"
uuid = { version = "1.22.0", features = ["v4"] }
agent-client-protocol = "2.0.0"
